server:
  port: 8082

spring:
  application:
    name: rag-documentation-search
  datasource:
    url: jdbc:h2:mem:ragdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

openai:
  api:
    key: ${OPENAI_API_KEY:sk-your-key-here}
